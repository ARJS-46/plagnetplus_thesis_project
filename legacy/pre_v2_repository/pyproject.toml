[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "plagnetplus"
version = "0.1.0"
description = "Self-supervised analysis of cathodoluminescence plagioclase imagery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Alexander Stringer"}
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
ssl = [
    "torch>=2.4",
    "torchvision>=0.19",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "umap-learn>=0.5.6",
]

dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plagnetplus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
